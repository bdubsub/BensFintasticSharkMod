name: codeql

on:
  pull_request:
  push:
    branches: [1.20.1, envy/0.24]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual
      - run: chmod +x ./gradlew
      - run: ./gradlew :forge:compileJava --no-daemon
      - uses: github/codeql-action/analyze@v3
